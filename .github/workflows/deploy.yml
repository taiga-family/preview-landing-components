name: 🚀 Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9683a0f31f8f8ee077e7c9d78238f0c0c7514a49 # v2.28.0
      - uses: taiga-family/ci/actions/setup/node@9683a0f31f8f8ee077e7c9d78238f0c0c7514a49 # v2.28.0
      - run: npx nx build demo --base-href /preview-landing-components/
      - uses: taiga-family/ci/actions/deploy/github-pages@9683a0f31f8f8ee077e7c9d78238f0c0c7514a49 # v2.28.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
          folder: dist/demo/browser

concurrency:
  group: deploy-${{ github.head_ref }}
  cancel-in-progress: true
