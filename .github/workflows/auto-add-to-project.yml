name: 🤖 Auto move new issues into Triage
on:
  issues:
    types: [opened]

jobs:
  automate-project-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/project@1daabf6d988679e27745db6cd38227d6daca3b37 # v2.21.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
