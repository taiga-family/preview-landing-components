name: 🤖 Auto move new issues into Triage
on:
  issues:
    types: [opened]

jobs:
  automate-project-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/project@c3c5b1dafd967e96aadf1cd4d589bd57fab81d43 # v2.18.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
