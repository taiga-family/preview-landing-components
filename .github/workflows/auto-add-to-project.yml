jobs:
  automate-project-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/project@75877d7e3d58b9e79a576a75246646dd11acaf0b # v2.26.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
