    types: [opened]

jobs:
  automate-project-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/project@579faa6aea387db865710ec9b7dea3c322f2d118 # v2.19.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
