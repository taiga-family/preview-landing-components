name: 🤖 Auto dependency review
on:
  pull_request:
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/security/dependency-review@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
