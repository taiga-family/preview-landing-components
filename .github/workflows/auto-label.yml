name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9683a0f31f8f8ee077e7c9d78238f0c0c7514a49 # v2.28.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@9683a0f31f8f8ee077e7c9d78238f0c0c7514a49 # v2.28.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
