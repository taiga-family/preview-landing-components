name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@579faa6aea387db865710ec9b7dea3c322f2d118 # v2.19.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@579faa6aea387db865710ec9b7dea3c322f2d118 # v2.19.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
