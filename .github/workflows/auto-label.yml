name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@27fd314c374c3df8ff203e6bab6ec03a5acaa7a0 # v2.27.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@27fd314c374c3df8ff203e6bab6ec03a5acaa7a0 # v2.27.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
