name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@75877d7e3d58b9e79a576a75246646dd11acaf0b # v2.26.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@75877d7e3d58b9e79a576a75246646dd11acaf0b # v2.26.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
