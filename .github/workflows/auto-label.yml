name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
