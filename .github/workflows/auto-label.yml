name: 🤖 Auto label
on: pull_request_review

jobs:
  label-when-approved:
    name: Label when approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@c3c5b1dafd967e96aadf1cd4d589bd57fab81d43 # v2.18.0
      - uses: taiga-family/ci/actions/auto/label-when-approved@c3c5b1dafd967e96aadf1cd4d589bd57fab81d43 # v2.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
